<!DOCTYPE html>
<html>
<head>
    <title>MediFind Chat</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .chat-container {
            width: 450px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .chat-box {
            height: 320px;
            overflow-y: scroll;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            color: blue;
        }

        .bot {
            text-align: left;
            color: green;
        }

        .card {
            border: 1px solid #ddd;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            background: #f9f9f9;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover {
            background: #e6f2ff;
            transform: scale(1.02);
        }

        .best {
            border: 2px solid gold;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <h2>MediFind Chat</h2>

    <div class="chat-box" id="chatBox">
        <div class="bot">Hello! Tell me your symptoms.</div>
    </div>

    <input type="text" id="userInput" placeholder="Type here..." onkeypress="handleEnter(event)">
    <button onclick="sendMessage()">Send</button>
</div>

<script>

let chatBox = document.getElementById("chatBox");
window.pendingDoctorType = null;

function addUser(text) {
    chatBox.innerHTML += `<div class="user">${text}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

function addBot(html) {
    chatBox.innerHTML += `<div class="bot">${html}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendMessage() {

    const input = document.getElementById("userInput");
    const text = input.value.trim();

    if (!text) return;

    addUser(text);
    input.value = "";

    try {
        const res = await fetch("http://127.0.0.1:8000/predict", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ 
            symptom: text,
            waiting_for_city: window.pendingDoctorType ? true : false,
            doctor_type: window.pendingDoctorType || null
                 })
        });

        const data = await res.json();

        if (data.type === "chat") {
            addBot(data.reply);
            return;
        }

        if(data.type === "ask_city"){
            addBot(data.reply);
            window.pendingDoctorType = data.doctor_type;
            return;
        }

        //symptom responsee
        window.pendingDoctorType = null;
        let html = `<b>🩺 ${data.doctor_type}</b><br><br>`;

        data.doctors.forEach(d => {

            let badge = d.best ? "⭐ BEST DOCTOR<br>" : "";

            html += `
                <div class="card ${d.best ? "best" : ""}" 
                     onclick="alert('Hospital: ${d.hospital}')">
                    ${badge}
                    👨‍⚕️ <b>${d.doctor}</b><br>
                    🏥 ${d.hospital}<br>
                    📍 ${d.area}<br>
                    ⭐ ${d.rating}<br>
                    🩺 ${d.speciality}
                </div>
            `;
        });

        addBot(html);

    } catch (err) {
        addBot("Server error. Try again.");
    }
}

function handleEnter(e) {
    if (e.key === "Enter") sendMessage();
}

</script>

</body>
</html>
