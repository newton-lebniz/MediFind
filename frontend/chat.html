<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MediFind</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="layout">

    <!-- LEFT SIDEBAR -->

    <div class="left-sidebar">

        <h2 id="profileName">
            User
        </h2>

        <p id="profileEmail">
            Email
        </p>

        <button onclick="resetChat()">
            Reset Chat
        </button>

        <button onclick="switchAccount()">
            Switch Account
        </button>

        <button onclick="logout()">
            Logout
        </button>

    </div>

    <!-- MAIN CHAT -->

    <div class="main-chat">

        <div class="chat-header"
             id="cityHeader">

            🏥 MediFind

        </div>

        <div class="chat-box"
             id="chatBox">

            <div class="bot">
                Hello! Tell me your symptoms.
            </div>

        </div>

        <div class="chat-footer">

            <input
                id="userInput"
                placeholder="Enter symptoms"
                onkeypress="handleEnter(event)"
            >

            <button onclick="sendMessage()">
                Send
            </button>

        </div>

    </div>

    <!-- RIGHT SIDEBAR -->

    <div class="right-sidebar">

        <h3>
            Upcoming Appointments
        </h3>

        <div id="upcomingAppointments"></div>

        <h3 style="margin-top:30px;">
            Previous Appointments
        </h3>

        <div id="previousAppointments"></div>

    </div>

</div>

<!-- BOOKING MODAL -->

<div class="modal"
     id="bookingModal">

    <div class="modal-content">

        <h2>
            Book Appointment
        </h2>

        <p id="bookingDoctor"></p>

        <input
            type="date"
            id="appointmentDate"
        >

        <select id="slotSelect">

            <option value="">
                Select Slot
            </option>

        </select>

        <div class="modal-buttons">

            <button onclick="confirmBooking()">
                Confirm
            </button>

            <button onclick="closeModal()">
                Cancel
            </button>

        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
