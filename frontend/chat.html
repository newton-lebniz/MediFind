<!DOCTYPE html>
<html>
<head>
    <title>MediFind Chat</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
        }

        .chat-container {
            width: 400px;
            margin: 50px auto;
            background-color: white;
            border: 1px solid #ccc;
            padding: 15px;
        }

        h2 {
            text-align: center;
        }

        .chat-box {
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }

        .user {
            text-align: right;
            color: blue;
            margin: 5px;
        }

        .bot {
            text-align: left;
            color: green;
            margin: 5px;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>

<body>

    <div class="chat-container">
        <h2>MediFind Chat</h2>

        <div class="chat-box" id="chatBox">
            <div class="bot">Hello! Tell me your symptoms.</div>
        </div>

        <input type="text" id="userInput" placeholder="Type here..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
       // function sendMessage() {
            async function sendMessage() {
    var input = document.getElementById("userInput").value.trim();
    var chatBox = document.getElementById("chatBox");
    if (input === "") return;

    chatBox.innerHTML += "<div class='user'>" + input + "</div>";
    document.getElementById("userInput").value = "";

    const res = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ symptom: input })
    });

    const data = await res.json();
    let reply = "Recommended: " + data.doctor_type + "<br>";
    if (data.doctors) {
        data.doctors.forEach(d => {
            reply += `⭐ ${d.name} (${d.city}) - Rating: ${d.rating}<br>`;
        });
    }
    chatBox.innerHTML += "<div class='bot'>" + reply + "</div>";
    chatBox.scrollTop = chatBox.scrollHeight;
}
      //  }

        // press Enter to send
        function handleEnter(event) {
            if (event.key === "Enter") sendMessage();
        }
    </script>

</body>
</html>
