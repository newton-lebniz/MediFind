<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MediFind Login</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="auth-container">

    <!-- LOGIN -->

    <div class="auth-box"
         id="loginBox">

        <h2>
            MediFind Login
        </h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button onclick="login()">
            Login
        </button>

        <div class="auth-switch">

            Don't have account?

            <span onclick="showSignup()">
                Signup
            </span>

        </div>

    </div>

    <!-- SIGNUP -->

    <div class="auth-box"
         id="signupBox"
         style="display:none;">

        <h2>
            MediFind Signup
        </h2>

        <input
            type="text"
            id="signupUsername"
            placeholder="Username"
        >

        <input
            type="email"
            id="signupEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <button onclick="signup()">
            Signup
        </button>

        <div class="auth-switch">

            Already have account?

            <span onclick="showLogin()">
                Login
            </span>

        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
