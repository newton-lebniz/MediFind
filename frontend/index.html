<!DOCTYPE html>
<html>
<head>
    <title>MediFind</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
            width: 60%;
            margin: auto;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: blue;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .features {
            margin-top: 40px;
        }

        .box {
            display: inline-block;
            width: 200px;
            margin: 10px;
            padding: 15px;
            background-color: white;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>MediFind</h1>

        <p>
            Enter your symptoms in simple words and get suggestions for which doctor to consult. You can also find doctors near your location.
        </p>

        <a href="chat.html" class="btn">Start Chat</a>

        <div class="features">

            <div class="box">
                <h3>AI Based</h3>
                <p>Basic system to understand symptoms</p>
            </div>

            <div class="box">
                <h3>Nearby Doctors</h3>
                <p>Find doctors based on your city</p>
            </div>

            <div class="box">
                <h3>Ratings</h3>
                <p>Shows doctor ratings (future feature)</p>
            </div>

        </div>
    </div>

</body>
</html>
